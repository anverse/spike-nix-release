# Container image. The Nix build sets the repository and the digest of the
# image this chart version was built with; the digest wins over the tag.
image:
  repository: "@repository@"
  digest: "@digest@"
  # Used when digest is empty; defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1

# The port the service listens on inside the pod (LISTEN_ADDR).
port: 8080

service:
  port: 80
  annotations: {}

# RuntimeClass for the pod, e.g. gvisor. Empty uses the cluster default.
runtimeClassName: ""

resources: {}
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Additional environment variables, as in a container spec.
extraEnv: []
