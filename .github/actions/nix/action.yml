name: nix
description: Install Nix and restore the cached Nix store
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v6
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'go.sum') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-linux: 4G
        gc-max-store-size-macos: 4G
