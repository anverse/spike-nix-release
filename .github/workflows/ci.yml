name: ci

# Every step calls a flake output; the same commands work on a laptop.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix
      - name: Build every artifact, go vet, gofmt, unit tests
        run: nix flake check --print-build-logs
      - name: Release dry runs
        run: |
          nix run .#release -- dist spikectl
          nix run .#release -- dist spiked
          nix run .#release -- dist spiked-echo
      - name: Record artifact digests
        run: |
          cp dist/spikectl/archives/checksums.txt digests.txt
          shasum -a 256 dist/spikectl/manifests/* dist/*/chart/* >> digests.txt
          for c in spiked spiked-echo; do
            echo "image $c $(grep -o 'sha256:[0-9a-f]*' dist/$c/image/index.json)" >> digests.txt
          done
          cat digests.txt
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}
          path: digests.txt

  # The same artifacts, bit for bit, from every runner.
  compare:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
      - run: |
          for d in digests-*/digests.txt; do diff -u digests-ubuntu-24.04/digests.txt "$d"; done
          echo "identical across runners"
