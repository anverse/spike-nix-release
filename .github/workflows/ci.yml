name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix
      - run: nix develop --command task lint
      - run: nix develop --command task test
      - run: nix develop --command task check
      - run: nix develop --command task release:dry-run COMPONENT=spikectl
      - run: nix develop --command task release:dry-run COMPONENT=spiked
      - name: Record artifact digests
        run: |
          cp dist/spikectl/archives/checksums.txt digests.txt
          sha256sum dist/spikectl/manifests/* dist/spiked/chart/* >> digests.txt
          echo "image $(jq -r '.manifests[0].digest' dist/spiked/image/index.json)" >> digests.txt
          cat digests.txt
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}
          path: digests.txt

  # The same artifacts, bit for bit, from every runner.
  compare:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
      - run: |
          ls
          for d in digests-*/digests.txt; do diff -u digests-ubuntu-24.04/digests.txt "$d"; done
          echo "identical across runners"
