# Release notes: every commit since the component's previous tag that
# touched the component's paths (--include-path, set by the release task).
# No commit message convention is assumed.

[changelog]
header = ""
body = """
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^release ", skip = true },
]
