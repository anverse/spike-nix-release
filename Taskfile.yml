version: "3"

# Optional shortcuts for people. Everything here is a flake output; CI calls
# the flake directly (see flake.nix for the list).

tasks:
  check:
    desc: Build every artifact, go vet, gofmt, unit tests
    cmds: [nix flake check --print-build-logs]

  e2e:
    desc: Development cluster, deploy, Helm tests
    cmds: [nix run .#dev -- e2e]

  dry-run:
    desc: 'Build a release into dist/ without publishing: task dry-run -- spiked'
    cmds: [nix run .#release -- dist {{.CLI_ARGS}}]

  release:
    desc: 'Cut a release: task release -- spikectl 0.2.0 "summary"'
    cmds: ['nix run .#release -- cut {{.CLI_ARGS}}']

  update:
    desc: Move pinned dependencies to their newest versions
    cmds: [nix run .#update]
