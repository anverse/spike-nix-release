version: "3"

# Keeping external dependencies current. Everything the build uses is pinned:
#
#   flake.lock      nixpkgs, and with it every tool (Go, Helm, regctl, …)
#   go.mod, go.sum  Go modules, plus vendorHash in nix/go.nix
#   pins.json       distroless base image, gVisor, k3s
#
# `task update` moves all of them to the newest versions and fixes the
# hashes. CI runs it weekly and opens a pull request when anything changed
# (.github/workflows/update.yml). GitHub Actions versions are updated by
# Dependabot (.github/dependabot.yml).

tasks:
  default:
    desc: Update every pinned dependency
    cmds:
      - task: flake
      - task: go
      - task: distroless
      - task: gvisor
      - task: k3s

  flake:
    desc: Update nixpkgs (all tools) in flake.lock
    cmds:
      - nix flake update

  go:
    desc: Update Go modules and the vendorHash
    env: { CGO_ENABLED: "0" }
    cmds:
      - go get -u ./...
      - go mod tidy
      - task: :vendor-hash

  distroless:
    desc: Pin the newest digest of the distroless base image
    vars:
      IMAGE:
        sh: jq -r '.distroless.image + ":" + .distroless.tag' pins.json
      LATEST:
        sh: regctl manifest digest {{.IMAGE}}
    status:
      - '[ "$(jq -r .distroless.digest pins.json)" = "{{.LATEST}}" ]'
    cmds:
      - echo "distroless {{.IMAGE}} -> {{.LATEST}}"
      # With an empty hash, Nix downloads the image and reports the hash it
      # got; that becomes the new pin.
      - task: set-pin
        vars: { FILTER: '.distroless.digest = "{{.LATEST}}" | .distroless.hash = ""' }
      - >-
        hash=$(nix build .#distroless --no-link 2>&1 | sed -n 's/.*got: *//p');
        test -n "$hash" && jq --arg h "$hash" '.distroless.hash = $h' pins.json > pins.json.new && mv pins.json.new pins.json
      - nix build .#distroless --no-link

  gvisor:
    desc: Pin the newest gVisor release
    vars:
      # GitHub tags look like release-20261005.0; the download path drops ".0".
      LATEST:
        sh: curl -fsSL https://api.github.com/repos/google/gvisor/releases/latest | jq -r .tag_name | sed 's/^release-//; s/\.0$//'
    status:
      - '[ "$(jq -r .gvisor.release pins.json)" = "{{.LATEST}}" ]'
    cmds:
      - echo "gVisor -> {{.LATEST}}"
      - for: [aarch64, x86_64]
        cmd: >-
          hash=$(nix store prefetch-file --json --hash-type sha512
          https://storage.googleapis.com/gvisor/releases/release/{{.LATEST}}/{{.ITEM}}/gvisor.tar.bz2 | jq -r .hash) &&
          jq --arg h "$hash" '.gvisor.hash.{{.ITEM}} = $h' pins.json > pins.json.new && mv pins.json.new pins.json
      - task: set-pin
        vars: { FILTER: '.gvisor.release = "{{.LATEST}}"' }

  k3s:
    desc: Pin the newest k3s of the configured channel
    vars:
      # The channel's version, e.g. v1.36.5+k3s1; image tags use "-".
      LATEST:
        sh: >-
          curl -fsSL https://update.k3s.io/v1-release/channels |
          jq -r --arg c "$(jq -r .k3s.channel pins.json)" '.data[] | select(.id == $c) | .latest' | tr + -
    status:
      - '[ "$(jq -r .k3s.tag pins.json)" = "{{.LATEST}}" ]'
    cmds:
      - echo "k3s -> {{.LATEST}}"
      - task: set-pin
        vars: { FILTER: '.k3s.tag = "{{.LATEST}}"' }

  set-pin:
    internal: true
    cmds:
      - jq '{{.FILTER}}' pins.json > pins.json.new
      - mv pins.json.new pins.json
